# Once a day, fetches visitor counts by country from GoatCounter and
# publishes them as visitors.json on the data branch, which the globe in the
# footer reads. The data branch holds one commit, replaced each time, so it
# never grows and main's history stays as it is.
name: Visitors

on:
  schedule:
    # 00:53 UTC, 6:23 am in India.
    - cron: "53 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch counts from GoatCounter
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SITE: https://aa-globe-track.goatcounter.com
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Add a GOATCOUNTER_TOKEN secret to publish visitor counts."
            exit 0
          fi
          start=2026-10-01T00:00:00Z
          end=$(date -u -d '+1 hour' +%Y-%m-%dT%H:00:00Z)
          # GoatCounter sometimes answers with a passing error, so each
          # request gets three tries, a minute apart.
          get() {
            for try in 1 2 3; do
              code=$(curl -sS --retry 3 -o "$2" -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$SITE/api/v0/stats/$1")
              [ "$code" = 200 ] && return
              echo "::warning::GoatCounter answered $code for $1 (try $try): $(head -c 300 "$2")"
              [ "$try" -lt 3 ] && sleep 60
            done
            echo "::error::GoatCounter kept failing for $1; the globe keeps the last counts."
            exit 1
          }
          get "total?start=$start&end=$end" total.json
          get "locations?start=$start&end=$end&limit=100" locations.json
          mkdir -p out
          jq -n --slurpfile t total.json --slurpfile l locations.json --arg at "$(date -u +%FT%TZ)" \
            '{updated: $at, total: $t[0].total, countries: [$l[0].stats[] | select(.id != "") | {id, name, count}]}' \
            > out/visitors.json
          cat out/visitors.json

      - name: Publish to the data branch
        if: hashFiles('out/visitors.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitors.json
          git commit -q -m "Update visitor counts"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" data
